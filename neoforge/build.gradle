plugins {
 id 'dev.architectury.loom-no-remap'
 id 'dev.architectury.loom'
 id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
 id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}
base { archivesName = "${rootProject.archives_base_name}-neoforge" }
sourceSets.main.java.srcDir file('src/client/java')
sourceSets.create('gametest')
loom {
 neoForge {}
 mods { main { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main; sourceSet sourceSets.gametest } }
 runs { client { runDir 'run/client' }; gameTestServer { server(); forgeTemplate 'gameTestServer'; source sourceSets.gametest; runDir 'run/gametest' } }
}
sourceSets {
 gametest { compileClasspath += sourceSets.main.output + configurations.compileClasspath; runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath }
}
configurations { common { canBeResolved = true; canBeConsumed = false }; compileClasspath.extendsFrom common }
modPublishing {
 version.set("${rootProject.mod_version}-neoforge")
 releaseTag.set("v${rootProject.mod_version}")
 displayName.set("${rootProject.mod_name} ${rootProject.mod_version} (NeoForge)")
 modLoaders.set(['neoforge'])
 fabricModJson.set(rootProject.layout.projectDirectory.file('fabric/build/resources/main/fabric.mod.json'))
 github.repository.set('brainage04/MagicCarpet')
 licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE'))
 modrinth.projectConfig.set(rootProject.layout.projectDirectory.file('.modrinth/project.json'))
 modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md'))
 modrinth.iconFile.set(rootProject.layout.projectDirectory.file('common/src/main/resources/assets/magic_carpet/icon.png'))
}
tasks.named('validateModPublication') { dependsOn ':fabric:processResources' }
dependencies { minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"; neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"; common(project(':common')) { transitive = false } }
processResources {
 inputs.properties(mod_version: rootProject.mod_version, minecraft_version: rootProject.minecraft_version, neoforge_version: rootProject.neoforge_version)
 filesMatching('META-INF/neoforge.mods.toml') { expand inputs.properties }
}
tasks.named('jar') { from project(':common').sourceSets.main.output; duplicatesStrategy = DuplicatesStrategy.EXCLUDE; from(rootProject.file('LICENSE')) { rename { "${it}_${rootProject.archives_base_name}-neoforge" } } }
tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource }
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn project(':common').tasks.named('jar') }
